name: CI
on: push

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'
                cache: 'npm'
            
            - name: Install dependencies
              run: npm ci
            
            - name: Run unit tests
              run: npx vitest run