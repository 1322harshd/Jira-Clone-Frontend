name: CI
on: push

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: jira_clone
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: jira_clone/package-lock.json
            
            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint
            
            - name: Run unit tests
              run: npx vitest run