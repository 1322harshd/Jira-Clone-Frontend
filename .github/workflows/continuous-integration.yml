name: CI
on: push

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: jira_clone
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: jira_clone/package-lock.json
            
            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint
            
            - name: Run unit tests
              run: npx vitest run
    
    deploy:
      needs: test
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        id-token: write
        contents: read
      env:
        TF_VAR_backend_domain: ${{ secrets.BACKEND_DOMAIN }}
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::013364996908:role/github-actions-jira-clone-frontend
            aws-region: ap-southeast-2
        
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_wrapper: false

        - name: Create or update infrastructure
          working-directory: infra
          run: |
              terraform init -input=false
              terraform apply -auto-approve -input=false
        
        - name: Read Terraform outputs
          id: tf
          working-directory: infra
          run: |
            echo "bucket=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
            echo "dist=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"
            echo "Site URL: $(terraform output -raw site_url)"
        
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
            cache-dependency-path: jira_clone/package-lock.json

        - name: Build
          working-directory: jira_clone
          run: |
            npm ci
            npm run build

        - name: Upload to S3
          run: aws s3 sync jira_clone/dist/ s3://${{ steps.tf.outputs.bucket }} --delete

        - name: Clear Cloudfront cache
          run: aws cloudfront create-invalidation --distribution-id ${{ steps.tf.outputs.dist }} --paths "/*" 